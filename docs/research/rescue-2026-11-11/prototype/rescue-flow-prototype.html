<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rescue flow prototype</title><style>
*{box-sizing:border-box}html,body{margin:0;font:14px/1.5 var(--font-sans,system-ui);color:var(--foreground,#e2e7ed)}.intro{color:var(--muted-foreground,#a9b1bc);font-size:12px;margin:8px 0 14px}.box{background:var(--card,#13171d);border:1px solid var(--border,#303943);padding:16px;border-radius:var(--radius,10px);margin:12px 0}h2{font-size:20px;margin:0 0 5px}h3{font-size:14px;margin:0 0 8px}.muted{color:var(--muted-foreground,#a9b1bc)}button{font:inherit;cursor:pointer;padding:7px 11px;border-radius:6px;border:1px solid var(--border,#3b4753);background:var(--secondary,#202933);color:var(--foreground,#e2e7ed)}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:2px solid var(--ring,#1be6ff);outline-offset:2px}.primary{background:var(--primary,#1be6ff);color:var(--primary-foreground,#062128)}.danger{background:var(--destructive,#b9384c);color:var(--destructive-foreground,white)}.controls,.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button[aria-pressed=true]{outline:2px solid var(--ring,#1be6ff)}.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border,#303943)}.row:last-child{border-bottom:0}.row .detail{flex:1;min-width:0}.row small{display:block;color:var(--muted-foreground,#a9b1bc)}.size{font-variant-numeric:tabular-nums;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stats strong{display:block;font-size:19px}.stats span{font-size:12px;color:var(--muted-foreground,#a9b1bc)}.notice{border-inline-start:3px solid var(--ring,#1be6ff);padding:8px 12px;margin:10px 0;color:var(--muted-foreground,#a9b1bc)}.confirm{border:1px solid var(--destructive,#b9384c);border-radius:8px;padding:14px}.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.steps button{font-size:12px}label{display:flex;align-items:center;gap:10px}input{accent-color:var(--primary,#1be6ff)}@media(max-width:500px){.row{flex-wrap:wrap}.row button{margin-left:auto}.stats{gap:6px}.stats strong{font-size:17px}}
</style></head><body>
<p class="intro">Throwaway flow demo. All data and measurements are made up. This demo cannot access your files or send network requests. Explore the move-to-Trash and permanent-removal boundary, owner return, and changed-item cases.</p>
<div class="tabs" id="scenarios" aria-label="Walkthroughs"></div>
<div class="box"><h2>Rescue space</h2><div class="stats" id="stats"></div><div id="coverage"></div><div id="screen"></div></div>
<div class="box"><h3>Current state</h3><div id="state"></div><div class="notice" id="notice" aria-live="polite"></div></div>
<div class="box"><h3>Free play</h3><div class="controls" id="actions"></div></div>
<div class="box"><h3 id="walk-title"></h3><div class="muted" id="walk-desc"></div><div class="steps" id="steps"></div></div>
<script>
const files=[{id:'build-a',name:'Project Alpha build data',gb:6},{id:'build-b',name:'Project Beta build data',gb:3}];
const walks={
 normal:{name:'Trash to usable space',description:'Review both files, move them to Trash, then confirm a separate permanent removal. Watch the moved total and the measured free space stay distinct.',steps:[['group','Open build data'],['choose','Choose both items'],['stage','Add chosen items'],['review','Review Cleanup List'],['trashAsk','Ask to move'],['trashMove','Confirm Trash move'],['permanentAsk','Ask to finish'],['permanentDo','Confirm permanent removal']]},
 changed:{name:'Changed Trash item',description:'An item changes after the Trash move. The permanent step must hold that item and report it, rather than deleting a new or changed object.',steps:[['group','Open build data'],['choose','Choose both'],['stage','Add chosen'],['review','Review list'],['trashAsk','Ask to move'],['trashMove','Move to Trash'],['change','Simulate changed item'],['permanentAsk','Ask to finish'],['permanentDo','Confirm safe subset']]},
 owner:{name:'Owner return',description:'Opening an owner does not report a space gain. Returning triggers one automatic fresh check. This demo simulates the return and its measurement.',steps:[['owner','Open Docker guidance'],['leave','Open owner'],['return','Simulate return and check']]},
 gaps:{name:'Incomplete scan',description:'Known items remain visible when another area cannot be read. This does not authorize an action on an unverified item.',steps:[['gap','Show a coverage gap'],['group','Review known build data'],['choose','Choose known items'],['stage','Add chosen items']]}
};
const labels={reset:'Reset demo',results:'Back to Rescue',group:'Review build data',choose:'Choose both items',stage:'Add chosen items',review:'Review Cleanup List',trashAsk:'Move to Trash…',trashMove:'Confirm Trash move',permanentAsk:'Finish these Trash items…',permanentDo:'Confirm permanent removal',cancel:'Cancel confirmation',change:'Simulate changed Trash item',owner:'Review Docker',leave:'Open owner app',return:'Simulate return',gap:'Show a coverage gap',keep:'Keep Docker',showKept:'Show excluded'};
function initial(){return {screen:'results',selected:[],staged:[],moved:[],removed:[],held:[],changed:false,gap:false,kept:false,free:18,dockerGB:64,checked:false,ownerPending:false,note:'Nothing selected. No file actions exist in this prototype.'}}
const available=s=>files.filter(x=>!s.moved.includes(x.id)&&!s.removed.includes(x.id));
function reduce(prev,action){let s={...prev,selected:[...prev.selected],staged:[...prev.staged],moved:[...prev.moved],removed:[...prev.removed],held:[...prev.held]};const reject=()=>({...s,note:'That step is not available in the current state. No change.'});
 switch(action){
 case 'reset':return initial();
 case 'results':s.screen='results';break;
 case 'group':s.screen='group';break;
 case 'choose':if(s.screen!=='group')return reject();s.selected=available(s).map(x=>x.id);s.note='Two illustrative items selected. Nothing moved.';break;
 case 'stage':if(s.screen!=='group'||!s.selected.length)return reject();s.staged=[...new Set([...s.staged,...s.selected])];s.screen='results';s.note='Chosen items staged. Files still exist in their original locations.';break;
 case 'review':if(!s.staged.length)return reject();s.screen='review';break;
 case 'trashAsk':if(s.screen!=='review')return reject();s.screen='trash-confirm';break;
 case 'trashMove':if(s.screen!=='trash-confirm')return reject();s.moved=[...s.staged];s.staged=[];s.selected=[];s.screen='trash-result';s.note='Moved to Trash in the story. The current free-space reading is unchanged. Nothing was deleted on your device.';break;
 case 'change':if(!s.moved.length)return reject();s.changed=true;s.note='The Alpha Trash item now has a changed identity in this story.';break;
 case 'permanentAsk':if(!s.moved.length)return reject();s.screen='permanent-confirm';break;
 case 'permanentDo':if(s.screen!=='permanent-confirm')return reject();s.held=s.changed?s.moved.filter(x=>x==='build-a'):[];s.removed=s.moved.filter(x=>!s.held.includes(x));s.moved=[...s.held];s.free=s.changed?19:24;s.checked=true;s.screen='completed';s.note='Illustrative measurement. Removed-byte totals do not determine the free-space reading. Changed items are held.';break;
 case 'cancel':if(s.screen==='trash-confirm')s.screen='review';else if(s.screen==='permanent-confirm')s.screen='trash-result';else return reject();s.note='Confirmation cancelled. No further change.';break;
 case 'owner':s.screen='owner';break;
 case 'leave':if(s.screen!=='owner')return reject();s.ownerPending=true;s.screen='away';s.note='Owner opened in the story. No size change is assumed yet.';break;
 case 'return':if(!s.ownerPending)return reject();s.ownerPending=false;s.checked=true;s.free=20;s.dockerGB=60;s.screen='results';s.note='One automatic check after owner return. Example readings: Docker 60 GB, Free now 20 GB. This is not a live measurement.';break;
 case 'gap':s.gap=true;s.note='Another area is unreadable. Known candidates remain visible; unverified actions stay held.';break;
 case 'keep':s.kept=true;s.note='Docker excluded in this story. In the product, exclusions are local and remembered. This demo forgets them on reload.';break;
 case 'showKept':s.screen='excluded';break;
 default:if(action.startsWith('toggle:')){const id=action.split(':')[1];if(s.screen!=='group'||!available(s).some(x=>x.id===id))return reject();s.selected=s.selected.includes(id)?s.selected.filter(x=>x!==id):[...s.selected,id]}else return reject();
 }return s}
let state=initial(),scenario='normal';
const size=ids=>files.filter(x=>ids.includes(x.id)).reduce((n,x)=>n+x.gb,0);
function btn(action,label,kind=''){return `<button class="${kind}" data-action="${action}">${label||labels[action]}</button>`}
function fileRows(ids){return files.filter(x=>ids.includes(x.id)).map(x=>`<div class="row"><span class="detail">${x.name}<small>Example path: /Example/build-data/${x.id}</small></span><span class="size">${x.gb} GB</span></div>`).join('')}
function draw(){
 document.getElementById('stats').innerHTML=`<div><strong>${state.free} GB</strong><span>Free now · ${state.checked?'example fresh check':'example starting value'}</span></div><div><strong>+${state.free-18} GB</strong><span>Measured change · synthetic</span></div><div><strong>5 GB</strong><span>Optional additional-space goal</span></div>`;
 document.getElementById('coverage').innerHTML=state.gap?'<p class="notice">Partial scan: one area could not be read. Show missing areas. Known results remain available.</p>':'';
 let view='';switch(state.screen){
 case 'results':view=`<p class="muted">Storage used · Largest first · Recoverable space may differ</p>${state.kept?'':`<div class="row"><span class="detail">Docker<small>Managed by Docker. Inspect its objects in the owner.</small></span><span class="size">${state.dockerGB} GB</span>${btn('owner','Review options')}${btn('keep','Keep')}</div>`}<div class="row"><span class="detail">Photos library<small>Your photos. Use the Photos storage controls.</small></span><span class="size">42 GB</span></div>${available(state).length?`<div class="row"><span class="detail">Xcode build data<small>Review projects. Rebuild cost applies.</small></span><span class="size">${size(available(state).map(x=>x.id))} GB</span>${btn('group','Review files')}</div>`:""}<p>${state.staged.length} items in Cleanup List ${state.staged.length?btn('review','Review list…'):'<button disabled>Review list…</button>'}</p>${state.kept?btn('showKept','Show 1 excluded item'):''}`;break;
 case 'group':view=`${btn('results','← Back to Rescue')}<h3>Build data · choose what to add</h3><p class="muted">No automatic selection. Full paths and owner detail belong in this review.</p>${available(state).map(x=>`<div class="row"><label class="detail"><input type="checkbox" data-toggle="${x.id}" ${state.selected.includes(x.id)?'checked':''}>${x.name}</label><span>${x.gb} GB</span></div>`).join('')}<p>${state.selected.length?btn('stage','Add chosen items','primary'):'<button disabled>Add chosen items</button>'}</p>`;break;
 case 'review':view=`<h3>Cleanup List review</h3>${fileRows(state.staged)}<p>${btn('results','Back')}${btn('trashAsk','Move to Trash…','primary')}</p>`;break;
 case 'trash-confirm':view=`<div class="confirm"><h3>Move ${state.staged.length} items to Trash?</h3><p>Review the exact items. Moving them does not free space yet.</p>${btn('cancel','Cancel')}${btn('trashMove','Move to Trash','primary')}</div>`;break;
 case 'trash-result':view=`<h3>Moved ${state.moved.length} items to Trash</h3><p>${size(state.moved)} GB allocated. Free now has not increased in this story.</p><p>${btn('permanentAsk','Finish these Trash items…')}${btn('results','Back to Rescue')}</p>`;break;
 case 'permanent-confirm':view=`<div class="confirm"><h3>Permanently delete this cleanup’s ${state.moved.length} Trash items?</h3><p>This cannot be undone. Other Trash items are outside this action. Changed items will be held.</p>${fileRows(state.moved)}<p>${btn('cancel','Cancel')}${btn('permanentDo','Delete permanently','danger')}</p></div>`;break;
 case 'completed':view=`<h3>Operation result</h3><p>Removed ${state.removed.length} items (${size(state.removed)} GB allocated). Held ${state.held.length}. Failed 0.</p><p class="muted">Example capacity change: +${state.free-18} GB. This is a separate reading, not the removed-byte sum.</p>${state.held.length?fileRows(state.held):''}${btn('results','Back to Rescue')}`;break;
 case 'owner':view=`${btn('results','← Back to Rescue')}<h3>Docker · 64 GB storage used</h3><p>This backing store holds containers and images. Its footprint is not a cleanup estimate. Review internal objects in Docker; do not Trash the disk image.</p>${btn('leave','Open Docker','primary')}`;break;
 case 'away':view=`<h3>Owner handoff in progress</h3><p>No cleanup is running in Tessera. In the product, returning after this handoff triggers one fresh check.</p>${btn('return','Simulate returning to Tessera')}`;break;
 case 'excluded':view=`<h3>Excluded items</h3><p>Docker · same object identity · 64 GB in this example</p><p>In the product you can restore this suggestion. A replacement object must not inherit the exclusion.</p>${btn('results','Back to Rescue')}`;break;
 }
 document.getElementById('screen').innerHTML=view;
 document.getElementById('state').textContent=`View: ${state.screen}. Chosen: ${state.selected.length}. Staged: ${state.staged.length}. In this operation’s Trash: ${state.moved.length}. Removed: ${state.removed.length}. Held: ${state.held.length}. Owner return pending: ${state.ownerPending?'yes':'no'}. Coverage: ${state.gap?'partial':'complete example'}. Excluded: ${state.kept?1:0}.`;
 document.getElementById('notice').textContent=state.note;
 document.querySelectorAll('[data-scenario]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.scenario===scenario));
 document.getElementById('walk-title').textContent=walks[scenario].name;document.getElementById('walk-desc').textContent=walks[scenario].description;document.getElementById('steps').innerHTML=walks[scenario].steps.map((x,i)=>btn(x[0],`${i+1}. ${x[1]}`)).join('');
}
document.getElementById('scenarios').innerHTML=Object.entries(walks).map(([k,v])=>`<button data-scenario="${k}">${v.name}</button>`).join('');document.getElementById('actions').innerHTML=Object.entries(labels).map(([k,v])=>btn(k,v)).join('');
document.addEventListener('click',e=>{const s=e.target.closest('[data-scenario]');if(s){scenario=s.dataset.scenario;state=initial();draw();return}const a=e.target.closest('[data-action]');if(a){state=reduce(state,a.dataset.action);draw()}});
document.addEventListener('change',e=>{if(e.target.dataset.toggle){state=reduce(state,'toggle:'+e.target.dataset.toggle);draw()}});draw();
</script></body></html>
