name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: macOS app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release and qualification tools
        run: |
          python3 tools/validate_release.py
          python3 tools/run_bounded.py --timeout 30 --log "$RUNNER_TEMP/tool-tests.log" --
            python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Toolchain
        run: xcodebuild -version

      - name: Generate the Xcode project
        run: >-
          python3 tools/run_bounded.py --timeout 180
          --log "$RUNNER_TEMP/xcodegen.log" -- bash -c
          'command -v xcodegen >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen; xcodegen generate'

      - name: Resolve Swift packages
        # XcodeGen is the source of truth. Keep generated metadata reviewable as
        # an artifact when adding SDKs or source groups.
        run: >-
          xcodebuild -resolvePackageDependencies
          -project Tessera.xcodeproj
          -scheme Tessera

      - name: Test
        run: >-
          xcodebuild test
          -project Tessera.xcodeproj
          -scheme Tessera
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

      - name: Compile release build
        run: >-
          xcodebuild build
          -project Tessera.xcodeproj
          -scheme Tessera
          -configuration Release
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

      - name: Save generated project metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-xcode-project
          path: |
            Tessera.xcodeproj/project.pbxproj
            Tessera.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: error
          retention-days: 14

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Compile production site
        run: pnpm build
