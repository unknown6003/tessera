name: Publish macOS auto-update release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, Sparkle-sign, and publish
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release identity
        env:
          CONFIRM_V1_RELEASE: ${{ vars.CONFIRM_V1_RELEASE }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Tessera/Info.plist)
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Tessera/Info.plist)
          expected_tag="v$version"
          [[ "$GITHUB_REF_NAME" == "$expected_tag" ]] || {
            echo "Tag $GITHUB_REF_NAME does not match Info.plist version $version" >&2
            exit 1
          }
          [[ "$build" =~ ^[1-9][0-9]*$ ]] || {
            echo "CFBundleVersion must be a positive integer" >&2
            exit 1
          }
          if [[ "$version" == 1.* && "$CONFIRM_V1_RELEASE" != YES ]]; then
            echo 'Publishing a 1.x milestone requires repository variable CONFIRM_V1_RELEASE=YES' >&2
            exit 1
          fi
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || {
            echo 'Missing SPARKLE_PRIVATE_KEY: export the existing Sparkle key and add it as a repository Actions secret.' >&2
            exit 1
          }

      # A STABLE signing identity is what makes macOS keep the user's Full Disk
      # Access grant across updates. TCC keys the grant to the app's designated
      # requirement; ad-hoc signing derives that from the binary's cdhash, which
      # changes every build, so every update looked like a different app and the
      # permission had to be granted again. Signing with one long-lived
      # certificate makes the requirement certificate-based, and therefore stable.
      - name: Import the code-signing identity
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$MACOS_CERT_P12" && -n "$MACOS_CERT_PASSWORD" ]] || {
            echo 'Missing MACOS_CERT_P12 / MACOS_CERT_PASSWORD: the signing identity is required so that' >&2
            echo 'Full Disk Access survives updates. See RELEASING.md.' >&2
            exit 1
          }
          keychain="$RUNNER_TEMP/build.keychain-db"
          kc_pass=$(uuidgen)
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/id.p12"

          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/id.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -f pkcs12
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          # codesign refuses an untrusted identity, so trust this certificate for
          # code signing on the runner only (the keychain is discarded with the VM).
          openssl pkcs12 -in "$RUNNER_TEMP/id.p12" -clcerts -nokeys \
            -passin pass:"$MACOS_CERT_PASSWORD" -out "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          rm -f "$RUNNER_TEMP/id.p12"

          identity=$(security find-identity -v -p codesigning "$keychain" \
            | grep 'Tessera Code Signing' | head -1 | sed -E 's/.*"(.*)"/\1/')
          [[ -n "$identity" ]] || { echo 'Signing identity not usable after import' >&2; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project Tessera.xcodeproj
          -scheme Tessera
          -derivedDataPath "$RUNNER_TEMP/DerivedData"

      - name: Test
        run: >-
          xcodebuild test
          -project Tessera.xcodeproj
          -scheme Tessera
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

      - name: Build ad-hoc signed app and disk image
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Tessera/Info.plist)
          xcodebuild build \
            -project Tessera.xcodeproj \
            -scheme Tessera \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=

          app="$RUNNER_TEMP/DerivedData/Build/Products/Release/Tessera.app"
          [[ -d "$app" ]]
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
          # Sign with the stable identity. Deliberately NOT --options runtime:
          # the hardened runtime turns on library validation, which requires every
          # loaded library to share the main binary's Team ID. A self-signed
          # identity has no Team ID, so Sparkle.framework fails to load and the app
          # dies at launch ("different Team IDs"). Hardened runtime is only needed
          # for notarization, which this identity cannot do anyway; it comes back
          # with Developer ID, which does have a Team ID.
          #
          # Also NOT --identifier: with --deep that stamps the app's bundle id onto
          # nested code too, renaming Sparkle.framework's identifier. codesign
          # already derives the app's identifier from CFBundleIdentifier.
          codesign --force --deep \
            --sign "$SIGN_IDENTITY" --keychain "$SIGN_KEYCHAIN" \
            --entitlements Tessera/Tessera.entitlements "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          # The hardened runtime must stay off for exactly the reason above.
          if codesign -dvv "$app" 2>&1 | grep -q 'flags=.*runtime'; then
            echo "Hardened runtime is set; library validation will break Sparkle loading at launch." >&2
            exit 1
          fi
          # Nested code must keep its own identity.
          sparkle_id=$(codesign -dvv "$app/Contents/Frameworks/Sparkle.framework" 2>&1 \
            | sed -n 's/^Identifier=//p')
          echo "Sparkle framework identifier: $sparkle_id"
          if [[ "$sparkle_id" == "$bundle_id" ]]; then
            echo "Sparkle.framework was stamped with the app's identifier." >&2
            exit 1
          fi

          # Guard the whole point of signing: the designated requirement must be
          # certificate-based. If it ever falls back to a cdhash requirement, the
          # user's Full Disk Access grant would break on the next update again —
          # fail the release instead of shipping that regression.
          requirement=$(codesign -d -r- "$app" 2>&1 | sed -n 's/^designated => //p')
          echo "designated requirement: $requirement"
          # A cdhash requirement is the regression we are guarding against: it is
          # per-build, so TCC would drop Full Disk Access on the next update.
          case "$requirement" in
            *cdhash*)
              echo "Designated requirement is cdhash-based; Full Disk Access would reset on update." >&2
              exit 1 ;;
          esac
          # Anything cert-anchored is stable. A self-signed identity is its own
          # root, so codesign writes "certificate root"; a CA-issued one (e.g. a
          # future Developer ID) writes "certificate leaf". Accept both.
          case "$requirement" in
            *certificate*) : ;;
            *) echo "Designated requirement is not certificate-based; Full Disk Access would reset on update." >&2
               exit 1 ;;
          esac
          case "$requirement" in
            *"$bundle_id"*) : ;;
            *) echo "Designated requirement does not pin the bundle identifier ($bundle_id)." >&2
               exit 1 ;;
          esac

          built_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          built_key=$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$app/Contents/Info.plist")
          source_key=$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' Tessera/Info.plist)
          [[ "$built_version" == "$version" ]]
          [[ "$built_key" == "$source_key" ]]

          # Actually launch the signed app before it can be published. Signature
          # verification passes on a build that cannot start — 0.1.5 verified
          # clean, then died in dyld because the hardened runtime blocked
          # Sparkle.framework. Only running it catches that class of break.
          # The app has a headless mode: scan a path, then quit.
          smoke_dir="$RELEASE_DIR/smoke"
          mkdir -p "$smoke_dir"
          SO_AUTOSCAN="$GITHUB_WORKSPACE/Tessera" \
          SO_SNAPSHOT_DIR="$smoke_dir" \
          SO_AUTOQUIT=1 \
            "$app/Contents/MacOS/Tessera" > "$smoke_dir/stdout.log" 2>&1 &
          smoke_pid=$!
          for _ in $(seq 1 90); do
            kill -0 "$smoke_pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$smoke_pid" 2>/dev/null; then
            kill -9 "$smoke_pid" 2>/dev/null || true
            echo 'Signed app did not exit within 90s during the launch smoke test.' >&2
            sed -n '1,60p' "$smoke_dir/stdout.log" >&2 || true
            exit 1
          fi
          wait "$smoke_pid" && smoke_rc=0 || smoke_rc=$?
          if [[ "$smoke_rc" -ne 0 ]]; then
            echo "Signed app failed to launch (exit $smoke_rc)." >&2
            sed -n '1,60p' "$smoke_dir/stdout.log" >&2 || true
            exit 1
          fi
          # Exiting 0 is not enough — prove it got far enough to do real work.
          if ! grep -q 'scan finished' "$smoke_dir/stdout.log"; then
            echo 'Signed app launched but never completed a scan.' >&2
            sed -n '1,60p' "$smoke_dir/stdout.log" >&2 || true
            exit 1
          fi
          echo "Launch smoke test passed."

          updates="$RELEASE_DIR/updates"
          stage="$RELEASE_DIR/dmg-stage"
          mkdir -p "$updates" "$stage"
          cp -R "$app" "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname Tessera -srcfolder "$stage" -ov -format UDZO \
            "$updates/Tessera-$version.dmg"

      - name: Generate and verify the signed Sparkle appcast
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Tessera/Info.plist)
          updates="$RELEASE_DIR/updates"
          tools=$(find "$RUNNER_TEMP/DerivedData/SourcePackages/artifacts" \
            -path '*/Sparkle/bin/generate_appcast' -type f -perm -111 -print -quit)
          [[ -x "$tools" ]] || {
            echo 'Sparkle generate_appcast tool was not found in resolved package artifacts' >&2
            exit 1
          }

          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$tools" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            "$updates"

          appcast="$updates/appcast.xml"
          [[ -s "$appcast" ]]
          grep -F 'sparkle:edSignature=' "$appcast"
          grep -F "<sparkle:shortVersionString>$version</sparkle:shortVersionString>" "$appcast"
          grep -F "Tessera-$version.dmg" "$appcast"

          cp "$updates/Tessera-$version.dmg" "$updates/Tessera.dmg"
          (cd "$updates" && shasum -a 256 Tessera.dmg "Tessera-$version.dmg" appcast.xml > SHA256SUMS)

      - name: Publish release atomically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Tessera/Info.plist)
          updates="$RELEASE_DIR/updates"
          gh release create "$GITHUB_REF_NAME" \
            "$updates/Tessera.dmg" \
            "$updates/Tessera-$version.dmg" \
            "$updates/appcast.xml" \
            "$updates/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tessera $version" \
            --generate-notes \
            --draft
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
